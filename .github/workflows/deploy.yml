# enebular クラウド実行環境へのデプロイ。deploy.mjs をそのまま使う（手元のデプロイと同じ手順）。
#
# デプロイ先は GitHub Environment（staging / production）で切り替える。Environment ごとに:
#   Secrets  : ENEBULAR_ACCESS_KEY / ENEBULAR_SECRET_KEY / FN_API_KEY / FN_BASIC_AUTH_USER / FN_BASIC_AUTH_PASSWORD
#   Variables: ENEBULAR_PROJECT_ID / ENEBULAR_CLOUD_ID / ENEBULAR_FILE_ASSET_ID / ENEBULAR_HTTP_TRIGGER_URL
#              ENEBULAR_TIMEOUT / FN_MOCK_MODE / FN_LOG_LEVEL（HTTP トリガーのパスは TRIGGER_URL の末尾から導く。
#              ENEBULAR_HTTP_TRIGGER_PATH は通常不要）
#              FN_DS_TABLE_SENSOR_DATA / FN_DS_TABLE_SENSORS / FN_SENSOR_QUERY_LIMIT / FN_SENSOR_QUERY_MAX_LIMIT / FN_MCP_SUMMARY_MAX_PAGES
# 設定方法は docs/deploy.md「GitHub Actions でデプロイする」。
#
# 最初は手動実行（workflow_dispatch）のみ。push での自動デプロイは下のコメントを外す。
name: Deploy to enebular

on:
  workflow_dispatch:
    inputs:
      environment:
        description: デプロイ先の GitHub Environment
        type: choice
        required: true
        default: staging
        options: [staging, production]
      apply_config:
        description: 実行環境の設定（HTTP トリガー / タイムアウト / connectDataStore / 環境変数 FN_*）も反映する。トリガーのパスは ENEBULAR_HTTP_TRIGGER_URL から導く
        type: boolean
        default: false
      skip_smoke:
        description: デプロイ後のスモークテスト（/v1/health の commit 照合）を省略する
        type: boolean
        default: false
  # push:
  #   branches: [main]

permissions:
  contents: read

# 同じ環境への同時デプロイを止める（後から来た方を待たせる）
concurrency:
  group: deploy-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment || 'staging' }}
      url: ${{ vars.ENEBULAR_HTTP_TRIGGER_URL }}
    env:
      # ---- enebular CLI（デプロイ操作）----
      ENEBULAR_ACCESS_KEY: ${{ secrets.ENEBULAR_ACCESS_KEY }}
      ENEBULAR_SECRET_KEY: ${{ secrets.ENEBULAR_SECRET_KEY }}
      ENEBULAR_PROJECT_ID: ${{ vars.ENEBULAR_PROJECT_ID }}
      ENEBULAR_CLOUD_ID: ${{ vars.ENEBULAR_CLOUD_ID }}
      ENEBULAR_FILE_ASSET_ID: ${{ vars.ENEBULAR_FILE_ASSET_ID }}
      ENEBULAR_HTTP_TRIGGER_PATH: ${{ vars.ENEBULAR_HTTP_TRIGGER_PATH }}
      ENEBULAR_HTTP_TRIGGER_URL: ${{ vars.ENEBULAR_HTTP_TRIGGER_URL }}
      ENEBULAR_TIMEOUT: ${{ vars.ENEBULAR_TIMEOUT }}
      # ---- 関数の環境変数（FN_ を外して envVars になる。apply_config のときだけ送られる）----
      FN_MOCK_MODE: ${{ vars.FN_MOCK_MODE }}
      FN_LOG_LEVEL: ${{ vars.FN_LOG_LEVEL }}
      FN_DS_TABLE_SENSOR_DATA: ${{ vars.FN_DS_TABLE_SENSOR_DATA }}
      FN_DS_TABLE_SENSORS: ${{ vars.FN_DS_TABLE_SENSORS }}
      FN_SENSOR_QUERY_LIMIT: ${{ vars.FN_SENSOR_QUERY_LIMIT }}
      FN_SENSOR_QUERY_MAX_LIMIT: ${{ vars.FN_SENSOR_QUERY_MAX_LIMIT }}
      FN_MCP_SUMMARY_MAX_PAGES: ${{ vars.FN_MCP_SUMMARY_MAX_PAGES }}
      FN_API_KEY: ${{ secrets.FN_API_KEY }}
      FN_BASIC_AUTH_USER: ${{ secrets.FN_BASIC_AUTH_USER }}
      FN_BASIC_AUTH_PASSWORD: ${{ secrets.FN_BASIC_AUTH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # アクセスキーの前後に空白や改行があると、原因表示なしで認証エラーになる。先に弾く
      - name: Check secrets and variables
        run: |
          fail=0
          for k in ENEBULAR_ACCESS_KEY ENEBULAR_SECRET_KEY ENEBULAR_PROJECT_ID ENEBULAR_CLOUD_ID ENEBULAR_FILE_ASSET_ID; do
            v="${!k}"
            if [ -z "$v" ]; then echo "::error::$k が Environment '${{ inputs.environment || 'staging' }}' に設定されていません"; fail=1
            elif [[ "$v" =~ [[:space:]] ]]; then echo "::error::$k に空白または改行が含まれています"; fail=1
            fi
          done
          if [ -z "$FN_DS_TABLE_SENSOR_DATA" ]; then echo "::warning::FN_DS_TABLE_SENSOR_DATA が未設定です（apply_config 時に configOk:false になります）"; fi
          if [ "$FN_MOCK_MODE" != "false" ]; then echo "::warning::FN_MOCK_MODE が false ではありません"; fi
          exit $fail

      - run: npm run typecheck
      - run: npm test

      - name: Show deploy settings (masked)
        run: node deploy.mjs check

      # deployId は /v1/health の commit と file-version 名になる（英数字・_・- のみ、30 文字以内）
      - name: Compute deploy id
        id: id
        run: echo "deploy_id=gh${{ github.run_number }}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Apply cloud config (HTTP trigger / timeout / connectDataStore / envVars)
        if: ${{ inputs.apply_config }}
        run: node deploy.mjs config

      - name: Build, upload ZIP, deploy, record version, smoke test
        run: node deploy.mjs deploy --commit "${{ steps.id.outputs.deploy_id }}" ${{ inputs.skip_smoke && '--no-smoke' || '' }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployed-${{ inputs.environment || 'staging' }}-${{ steps.id.outputs.deploy_id }}
          path: sensor-mcp-server-function.zip
          retention-days: 30
          if-no-files-found: ignore
